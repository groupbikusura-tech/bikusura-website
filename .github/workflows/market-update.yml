            return gold_pm,(gold_pm-prev_gold)/prev_gold*100 if prev_gold else 0,datetime.now(IST).date().isoformat(),silver_pm,(silver_pm-prev_silver)/prev_silver*100 if prev_silver else 0,datetime.now(IST).date().isoformat(),str(prev_date) if prev_date else 'Previous published session'
          try:
