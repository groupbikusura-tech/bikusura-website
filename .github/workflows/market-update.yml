name: Bikusura Daily Market Update

on:
  push:
    paths:
      - '.github/workflows/market-update.yml'
  schedule:
    - cron: "15 1 * * *"
    - cron: "45 3 * * *"
    - cron: "15 10 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bikusura-daily-market-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate market snapshot
        run: |
          python <<'PY'
          import html,json,subprocess,time
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from urllib.parse import quote
          IST=timezone(timedelta(hours=5,minutes=30)); now=datetime.now(IST)
          date_text=now.strftime('%d %B %Y').upper(); updated_text=now.strftime('%d %b %Y, %I:%M %p IST')
          tickers={'Nikkei 225':'^N225','KOSPI':'^KS11','Shanghai Composite':'^SSEC','Hang Seng':'^HSI','Dow Jones':'^DJI','S&P 500':'^GSPC','NASDAQ':'^IXIC','Sensex':'^BSESN','Nifty 50':'^NSEI','Nifty Bank':'^NSEBANK','USD/INR':'INR=X','Brent Crude':'BZ=F','WTI Crude':'CL=F','Gold':'GC=F','Silver':'SI=F','Bitcoin':'BTC-USD','Ethereum':'ETH-USD'}
          def getj(u):
            p=subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','30','--retry','4','--retry-delay','2','-A','Mozilla/5.0',u],capture_output=True,text=True)
            if p.returncode: raise RuntimeError(p.stderr.strip() or str(p.returncode))
            return json.loads(p.stdout)
          def batch():
            syms=list(tickers.values()); j=','.join(quote(s,safe='') for s in syms)
            for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']:
              try:
                rs=(getj(f'https://{host}/v7/finance/spark?symbols={j}&range=10d&interval=1d&indicators=close').get('spark') or {}).get('result') or []; out={}
                for x in rs:
                  r=(x.get('response') or [{}])[0]; ts=r.get('timestamp') or []; cs=((r.get('indicators') or {}).get('quote') or [{}])[0].get('close') or []; rows=[(datetime.fromtimestamp(t,timezone.utc).date(),float(c)) for t,c in zip(ts,cs) if c is not None]
                  if rows:
                    rows.sort(); d,v=rows[-1]; prev=rows[-2][1] if len(rows)>1 else v; out[x['symbol']]=(v,(v-prev)/prev*100 if prev else 0,str(d))
                if len(out)>=9: return {s:out.get(s,(None,None,'Latest available')) for s in syms}
              except Exception as e: print('WARN Yahoo:',e)
              time.sleep(2)
            return {s:(None,None,'Latest available') for s in syms}
          raw=batch(); data={n:raw[s] for n,s in tickers.items()}
          try:
            g=(getj('https://www.nseindia.com/api/marketStatus').get('giftnifty') or {}); gift=(float(g['LASTPRICE']),float(g['PERCHANGE']),str(g.get('TIMESTMP') or 'NSE IX'))
          except Exception as e: print('WARN GIFT:',e); gift=(None,None,'NSE IX / latest available')
          def fmt(v,d=2): return 'N/A' if v is None else f'{v:,.{d}f}'
          def card(n,v,c,note):
            cl='up' if c is not None and c>0 else 'down' if c is not None and c<0 else 'neutral'; ch='N/A' if c is None else f'▲ {c:.2f}%' if c>0 else f'▼ {abs(c):.2f}%' if c<0 else '0.00%'
            return f'<div class="card"><div class="name">{html.escape(n)}</div><div class="value">{v}</div><div class="change {cl}">{ch}</div><div class="note">{html.escape(str(note))}</div></div>'
          def sec(t,c): return f'<section><h2>{t}</h2><div class="grid">{c}</div></section>'
          def q(n): return data[n]
          glob=''.join(card(n,fmt(q(n)[0]),q(n)[1],q(n)[2]) for n in ['Nikkei 225','KOSPI','Shanghai Composite','Hang Seng','Dow Jones','S&P 500','NASDAQ'])
          india=card('GIFT Nifty',fmt(gift[0]),gift[1],gift[2])+''.join(card(n,fmt(q(n)[0]),q(n)[1],q(n)[2]) for n in ['Sensex','Nifty 50','Nifty Bank'])
          usd=q('USD/INR')[0]; gold=q('Gold')[0]; silver=q('Silver')[0]; btc=q('Bitcoin')[0]; eth=q('Ethereum')[0]
          gold10=gold*usd*10/31.1034768 if gold and usd else None; silkg=silver*usd*1000/31.1034768 if silver and usd else None; btci=btc*usd if btc and usd else None; ethi=eth*usd if eth and usd else None
          css='body{font-family:Arial;background:linear-gradient(135deg,#071a33,#020b17);color:#fff;margin:0;padding:30px}header{text-align:center;padding:20px;border-bottom:1px solid #806b25}.logo{font-size:28px;font-weight:800;color:#f1d77a}.tag{color:#aebbd0;font-size:12px;letter-spacing:3px}.date{display:inline-block;margin:20px;padding:9px 18px;border:1px solid #806b25;border-radius:30px;color:#f1d77a}.container{max-width:1100px;margin:auto}.intro{text-align:center}.intro p,.note{color:#aebbd0;font-size:12px}.snapshot{margin:25px 0;padding:15px;text-align:center;border:1px solid #806b25;border-radius:15px}.section{margin-top:28px}h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#ffffff0d;border:1px solid #ffffff18;border-radius:15px;padding:19px}.name{color:#aebbd0;font-size:12px;text-transform:uppercase}.value{font-size:23px;font-weight:800;margin-top:8px}.change{margin-top:7px;font-weight:700}.up{color:#28c76f}.down{color:#ff5c5c}.neutral{color:#f1d77a}.insight{margin-top:28px;padding:20px;border:1px solid #806b25;border-radius:15px;color:#d6dfec}footer{text-align:center;margin-top:30px;padding:25px;color:#aebbd0}footer strong{color:#f1d77a}'
          h=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bikusura Group | Daily Market Updates - {date_text.title()}</title><style>{css}</style></head><body><header><div class="logo">BIKUSURA GROUP</div><div class="tag">BUILDING WEALTH • CREATING LEGACY</div><div class="date">{date_text}</div></header><main class="container"><div class="intro"><h1>Daily Market Updates</h1><p>Global, Indian, Commodity &amp; Crypto Market Snapshot</p></div><div class="snapshot">Automatically updated market data • Last update: {updated_text}</div>{sec('Global Indices',glob)}{sec('Indian Market',india)}{sec('INR / Dollar',card('USD / INR','₹'+fmt(usd),q('USD/INR')[1],'1 USD in INR'))}{sec('Crude Oil',card('Brent Crude','$'+fmt(q('Brent Crude')[0]),q('Brent Crude')[1],'Per barrel')+card('WTI Crude','$'+fmt(q('WTI Crude')[0]),q('WTI Crude')[1],'Per barrel'))}{sec('Gold &amp; Silver',card('Gold','₹'+fmt(gold10,0),q('Gold')[1],'Indicative INR • Per 10 gm')+card('Silver','₹'+fmt(silkg,0),q('Silver')[1],'Indicative INR • Per kg'))}{sec('Crypto • INR Spot',card('Bitcoin (BTC)','₹'+fmt(btci,0),q('Bitcoin')[1],'Daily spot • INR')+card('Ethereum (ETH)','₹'+fmt(ethi,0),q('Ethereum')[1],'Daily spot • INR'))}<div class="insight"><h2>Market Insight</h2><p>Market data is fetched automatically. Yahoo Finance uses one multi-symbol request to reduce rate-limit failures; GIFT Nifty comes from the NSE India market-status feed.</p></div></main><footer><strong>BIKUSURA GROUP</strong><div>Market data is for information only and is not investment advice.</div></footer></body></html>'''
          Path('Bikusura_Daily_Market_Updates.html').write_text(h,encoding='utf-8')
          print('Generated',updated_text)
          PY
      - name: Commit and push updated page
        run: |
          git config user.name "bikusura-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add Bikusura_Daily_Market_Updates.html
          if git diff --cached --quiet; then echo "No page changes"; else git commit -m "chore: update daily market data"; git push; fi
