name: Update Market Close

on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install dependency
        run: python -m pip install requests
      - name: Fetch latest market close
        run: python scripts/update_market_close.py
      - name: Commit updated data
        run: |
          git config user.name "Bikusura Market Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-close.json
          if git diff --cached --quiet; then
            echo "No market-data change to commit."
          else
            git commit -m "chore: update market close data"
            git push
          fi
