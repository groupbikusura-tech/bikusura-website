name: Bikusura Daily Market Update

on:
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install market data library
        run: pip install yfinance

      - name: Generate Daily Market Update
        run: |
          python <<'PY'
          import yfinance as yf
          from datetime import datetime, timezone, timedelta

          IST = timezone(timedelta(hours=5, minutes=30))
          now = datetime.now(IST)
          date_text = now.strftime("%d %B %Y").upper()

          tickers = {
              "Nikkei 225": "^N225",
              "KOSPI": "^KS11",
              "Shanghai Composite": "^SSEC",
              "Hang Seng": "^HSI",
              "Dow Jones": "^DJI",
              "S&P 500": "^GSPC",
              "NASDAQ": "^IXIC",
              "Sensex": "^BSESN",
              "Nifty 50": "^NSEI",
              "Nifty Bank": "^NSEBANK",
              "USD/INR": "INR=X",
              "Brent Crude": "BZ=F",
              "WTI Crude": "CL=F",
              "Spot Gold": "GC=F",
              "Spot Silver": "SI=F"
          }

          def get_data(symbol):
              try:
                  data = yf.Ticker(symbol).history(period="5d", interval="1d")
                  data = data.dropna(subset=["Close"])
                  if len(data) == 0:
                      return None, None
                  close = float(data["Close"].iloc[-1])
                  previous = float(data["Close"].iloc[-2]) if len(data) > 1 else close
                  change = ((close - previous) / previous) * 100 if previous else 0
                  return close, change
              except Exception:
                  return None, None

          def fmt(value, decimals=2):
              if value is None:
                  return "N/A"
              return f"{value:,.{decimals}f}"

          def card(name, value, change, note):
              if change is None:
                  cls = "neutral"
                  change_text = "Latest available"
              elif change > 0:
                  cls = "up"
                  change_text = f"▲ {change:.2f}%"
              elif change < 0:
                  cls = "down"
                  change_text = f"▼ {abs(change):.2f}%"
              else:
                  cls = "neutral"
                  change_text = "0.00%"

              return f"""
              <div class="card">
                <div class="name">{name}</div>
                <div class="value">{value}</div>
                <div class="change {cls}">{change_text}</div>
                <div class="note">{note}</div>
              </div>
              """

          data = {}
          for name, symbol in tickers.items():
              data[name] = get_data(symbol)

          def val(name):
              return data[name][0]

          def chg(name):
              return data[name][1]

          html = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Bikusura Group | Daily Market Updates - {date_text.title()}</title>

          <style>
          :root{{
            --navy:#071a33;
            --navy2:#0d2748;
            --gold:#d4af37;
            --gold2:#f1d77a;
            --white:#ffffff;
            --muted:#aebbd0;
            --green:#28c76f;
            --red:#ff5c5c;
            --card:rgba(255,255,255,.055);
            --border:rgba(212,175,55,.28);
          }}

          *{{margin:0;padding:0;box-sizing:border-box}}

          body{{
            font-family:Arial,Helvetica,sans-serif;
            background:linear-gradient(135deg,var(--navy),#020b17);
            color:var(--white);
            min-height:100vh;
          }}

          header{{
            padding:42px 20px 30px;
            text-align:center;
            border-bottom:1px solid var(--border);
            background:linear-gradient(180deg,#0c2749,#071a33);
          }}

          .logo{{
            font-size:28px;
            font-weight:800;
            letter-spacing:2px;
            color:var(--gold2);
          }}

          .tagline{{
            margin-top:7px;
            font-size:12px;
            letter-spacing:3px;
            color:var(--muted);
          }}

          .date{{
            margin-top:22px;
            display:inline-block;
            padding:9px 18px;
            border:1px solid var(--border);
            border-radius:30px;
            color:var(--gold2);
            font-size:13px;
            font-weight:700;
          }}

          .container{{
            width:min(1100px,92%);
            margin:30px auto 60px;
          }}

          .intro{text-align:center;margin-bottom:28px}
          .intro h1{{font-size:30px;margin-bottom:8px}}
          .intro p{{color:var(--muted);font-size:14px}}

          .snapshot{{
            background:rgba(212,175,55,.08);
            border:1px solid var(--border);
            border-radius:15px;
            padding:15px 18px;
            margin-bottom:25px;
            text-align:center;
            color:#dce5f3;
            font-size:13px;
          }}

          .section{{margin-top:28px}}

          .section-title{{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:14px;
          }}

          .section-title span{{
            width:4px;
            height:25px;
            background:var(--gold);
            border-radius:5px;
          }}

          .section-title h2{{font-size:20px;letter-spacing:.5px}}

          .grid{{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
            gap:15px;
          }}

          .card{{
            background:var(--card);
            border:1px solid rgba(255,255,255,.09);
            border-radius:15px;
            padding:19px;
            transition:.25s;
          }}

          .card:hover{{
            transform:translateY(-3px);
            border-color:var(--border);
          }}

          .name{{
            color:var(--muted);
            font-size:12px;
            text-transform:uppercase;
            letter-spacing:1px;
            margin-bottom:9px;
          }}

          .value{{
            font-size:23px;
            font-weight:800;
            color:var(--white);
          }}

          .change{{
            margin-top:7px;
            font-size:13px;
            font-weight:700;
          }}

          .up{{color:var(--green)}}
          .down{{color:var(--red)}}
          .neutral{{color:var(--gold2)}}

          .note{{
            margin-top:8px;
            font-size:10px;
            color:#8393aa;
          }}

          .insight{{
            margin-top:28px;
            padding:24px;
            border-radius:18px;
            background:linear-gradient(145deg,rgba(212,175,55,.12),rgba(255,255,255,.035));
            border:1px solid var(--border);
          }}

          .insight h2{{
            color:var(--gold2);
            margin-bottom:12px;
          }}

          .insight p{{
            color:#d6dfec;
            line-height:1.7;
            font-size:14px;
          }}

          .footer{{
            text-align:center;
            padding:30px 20px;
            border-top:1px solid var(--border);
            color:var(--muted);
            font-size:12px;
          }}

          .footer strong{{color:var(--gold2)}}

          .disclaimer{{
            margin-top:10px;
            font-size:10px;
            color:#718097;
            line-height:1.5;
          }}

          @media(max-width:600px){{
            .intro h1{{font-size:24px}}
            .logo{{font-size:24px}}
            .value{{font-size:21px}}
          }}
          </style>
          </head>

          <body>

          <header>
            <div class="logo">BIKUSURA GROUP</div>
            <div class="tagline">BUILDING WEALTH • CREATING LEGACY</div>
            <div class="date">{date_text}</div>
          </header>

          <main class="container">

          <div class="intro">
            <h1>Daily Market Updates</h1>
            <p>Global & Indian Market Snapshot</p>
          </div>

          <div class="snapshot">
            Automatically updated market data • Latest available market snapshot
          </div>

          <section class="section">
            <div class="section-title">
              <span></span>
              <h2>Global Indices</h2>
            </div>

            <div class="grid">
          {card("Nikkei 225 • Japan", fmt(val("Nikkei 225")), chg("Nikkei 225"), "Latest available")}
          {card("KOSPI • South Korea", fmt(val("KOSPI")), chg("KOSPI"), "Latest available")}
          {card("Shanghai Composite • China", fmt(val("Shanghai Composite")), chg("Shanghai Composite"), "Latest available")}
          {card("Hang Seng • Hong Kong", fmt(val("Hang Seng")), chg("Hang Seng"), "Latest available")}
          {card("Dow Jones • USA", fmt(val("Dow Jones")), chg("Dow Jones"), "Latest U.S. close")}
          {card("S&P 500 • USA", fmt(val("S&P 500")), chg("S&P 500"), "Latest U.S. close")}
          {card("NASDAQ • USA", fmt(val("NASDAQ")), chg("NASDAQ"), "Latest U.S. close")}
            </div>
          </section>

          <section class="section">
            <div class="section-title">
              <span></span>
              <h2>Indian Market</h2>
            </div>

            <div class="grid">
          {card("Sensex", fmt(val("Sensex")), chg("Sensex"), "Latest available")}
          {card("Nifty 50", fmt(val("Nifty 50")), chg("Nifty 50"), "Latest available")}
          {card("Nifty Bank", fmt(val("Nifty Bank")), chg("Nifty Bank"), "Latest available")}
            </div>
          </section>

          <section class="section">
            <div class="section-title">
              <span></span>
              <h2>INR / Dollar</h2>
            </div>

            <div class="grid">
          {card("USD / INR", "₹" + fmt(val("USD/INR")), chg("USD/INR"), "USD per INR conversion")}
            </div>
          </section>

          <section class="section">
            <div class="section-title">
              <span></span>
              <h2>Crude Oil</h2>
            </div>

            <div class="grid">
          {card("Brent Crude", "$" + fmt(val("Brent Crude")), chg("Brent Crude"), "Per barrel")}
          {card("WTI Crude", "$" + fmt(val("WTI Crude")), chg("WTI Crude"), "Per barrel")}
            </div>
          </section>

          <section class="section">
            <div class="section-title">
              <span></span>
              <h2>Gold & Silver</h2>
            </div>

            <div class="grid">
          {card("Spot Gold", "$" + fmt(val("Spot Gold")), chg("Spot Gold"), "Per troy ounce")}
          {card("Spot Silver", "$" + fmt(val("Spot Silver")), chg("Spot Silver"), "Per troy ounce")}
            </div>
          </section>

          <section class="insight">
            <h2>Market Insight</h2>
            <p>
              Global and Indian markets are being monitored automatically.
              Equity indices, currency, crude oil, gold and silver prices
              shown above are refreshed from the latest available market data.
              Investors should monitor market conditions, global risk,
              interest-rate expectations and commodity movements.
            </p>
          </section>

          </main>

          <footer class="footer">
            <div><strong>BIKUSURA GROUP</strong></div>
            <div>BUILDING WEALTH • CREATING LEGACY</div>
            <div class="disclaimer">
              Market data is provided for informational purposes only and may
              change during market hours. This page is not investment advice.
            </div>
          </footer>

          </body>
          </html>
          """

          with open("Bikusura_Daily_Market_Updates.html", "w", encoding="utf-8") as f:
              f.write(html)

          print("Market update generated successfully:", date_text)
          PY

      - name: Commit and publish update
        run: |
          git config user.name "Bikusura Market Bot"
          git config user.email "groupbikusura@gmail.com"
          git add Bikusura_Daily_Market_Updates.html
          git diff --cached --quiet || git commit -m "Automatic daily market update"
          git push
