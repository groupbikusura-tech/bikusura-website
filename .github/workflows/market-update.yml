name: Bikusura Daily Market Update

on:
  push:
    paths:
      - '.github/workflows/market-update.yml'
  schedule:
    - cron: "15 1 * * *"
    - cron: "45 3 * * *"
    - cron: "15 10 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bikusura-daily-market-update
  cancel-in-progress: false

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate market snapshot
        run: |
          python <<'PY'
          import html,json,subprocess,time
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from urllib.parse import quote
          IST=timezone(timedelta(hours=5,minutes=30)); now=datetime.now(IST)
          date_text=now.strftime('%d %B %Y').upper(); updated_text=now.strftime('%d %b %Y, %I:%M %p IST')
          tickers={'Nikkei 225':'^N225','KOSPI':'^KS11','Hang Seng':'^HSI','Dow Jones':'^DJI','S&P 500':'^GSPC','NASDAQ':'^IXIC','Sensex':'^BSESN','Nifty 50':'^NSEI','Nifty Bank':'^NSEBANK','USD/INR':'INR=X','Brent Crude':'BZ=F','WTI Crude':'CL=F','Gold':'GC=F','Silver':'SI=F','Bitcoin':'BTC-USD','Ethereum':'ETH-USD'}
          def getj(u):
            p=subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','30','--retry','4','--retry-delay','2','-A','Mozilla/5.0',u],capture_output=True,text=True)
            if p.returncode: raise RuntimeError(p.stderr.strip() or str(p.returncode))
            return json.loads(p.stdout)
          def batch():
            syms=list(tickers.values()); j=','.join(quote(s,safe='') for s in syms)
            # Use Yahoo Chart API and convert each instrument's timestamps into
            # the exchange timezone reported by Yahoo. Spark's UTC date labels
            # can shift Asian-market closes to the wrong calendar day.
            for host in ['query1.finance.yahoo.com','query2.finance.yahoo.com']:
              try:
                out={}
                for sym in syms:
                  u=f'https://{host}/v8/finance/chart/{quote(sym,safe="")}?range=10d&interval=1d&events=history'
                  r=(getj(u).get('chart') or {}).get('result') or []
                  if not r: continue
                  r=r[0]; meta=r.get('meta') or {}
                  import zoneinfo
                  tzname=meta.get('exchangeTimezoneName') or 'UTC'
                  try: tz=zoneinfo.ZoneInfo(tzname)
                  except Exception: tz=timezone.utc
                  ts=r.get('timestamp') or []
                  closes=((r.get('indicators') or {}).get('quote') or [{}])[0].get('close') or []
                  rows=[]
                  for t,v in zip(ts,closes):
                    if v is not None:
                      rows.append((datetime.fromtimestamp(t,timezone.utc).astimezone(tz).date(),float(v)))
                  if rows:
                    rows.sort(); d,v=rows[-1]; prev=rows[-2][1] if len(rows)>1 else v
                    out[sym]=(v,(v-prev)/prev*100 if prev else 0,str(d))
                if len(out)>=9:
                  return {s:out.get(s,(None,None,'Latest available')) for s in syms}
              except Exception as e: print('WARN Yahoo:',e)
              time.sleep(2)
            return {s:(None,None,'Latest available') for s in syms}

          raw=batch(); data={n:raw[s] for n,s in tickers.items()}

          # Data-quality guard: after the Indian cash market has closed,
          # never publish a previous-session snapshot as today's close.
          # Before 16:00 IST, the latest completed NSE session is yesterday
          # (or the previous weekday); after 16:00 it is today's session.
          def previous_weekday(d):
            d=d-timedelta(days=1)
            while d.weekday() >= 5: d-=timedelta(days=1)
            return d
          if now.weekday() >= 5:
            expected_nse=previous_weekday(now.date())
          elif now.hour < 16:
            expected_nse=previous_weekday(now.date())
          else:
            expected_nse=now.date()
          for name in ['Sensex','Nifty 50','Nifty Bank']:
            row=data.get(name)
            if not row or row[2] != str(expected_nse):
              raise RuntimeError(f"Refusing stale {name}: got {row[2] if row else 'missing'}, expected {expected_nse}")
          try:
            g=(getj('https://www.nseindia.com/api/marketStatus').get('giftnifty') or {}); gift=(float(g['LASTPRICE']),float(g['PERCHANGE']),str(g.get('TIMESTMP') or 'NSE IX'))
          except Exception as e: print('WARN GIFT:',e); gift=(None,None,'NSE IX / latest available')
          def fmt(v,d=2): return 'N/A' if v is None else f'{v:,.{d}f}'
          def card(n,v,c,note):
            cl='up' if c is not None and c>0 else 'down' if c is not None and c<0 else 'neutral'; ch='N/A' if c is None else f'▲ {c:.2f}%' if c>0 else f'▼ {abs(c):.2f}%' if c<0 else '0.00%'
            return f'<div class="card"><div class="name">{html.escape(n)}</div><div class="value">{v}</div><div class="change {cl}">{ch}</div><div class="note">{html.escape(str(note))}</div></div>'
          def sec(t,c): return f'<section><h2>{t}</h2><div class="grid">{c}</div></section>'
          def q(n): return data[n]
          glob=''.join(card(n,fmt(q(n)[0]),q(n)[1],q(n)[2]) for n in ['Nikkei 225','KOSPI','Hang Seng','Dow Jones','S&P 500','NASDAQ'])
          india=card('GIFT Nifty',fmt(gift[0]),gift[1],gift[2])+''.join(card(n,fmt(q(n)[0]),q(n)[1],q(n)[2]) for n in ['Sensex','Nifty 50','Nifty Bank'])
          usd=q('USD/INR')[0]; btc=q('Bitcoin')[0]; eth=q('Ethereum')[0]
          # Indian bullion must use IBJA benchmark rates, not COMEX futures
          # converted through USD/INR. IBJA publishes Gold 999 per 10g and
          # Silver 999 per kg; use the latest PM rate and compare with the
          # previous published PM session.
          def ibja_rates():
            import re
            from html.parser import HTMLParser
            class P(HTMLParser):
              def __init__(self): super().__init__(); self.rows=[]; self.row=None; self.cell=None
              def handle_starttag(self,tag,attrs):
                if tag=='tr': self.row=[]
                elif tag in ('td','th') and self.row is not None: self.cell=''
              def handle_data(self,data):
                if self.row is not None and self.cell is not None: self.cell+=data
              def handle_endtag(self,tag):
                if tag in ('td','th') and self.row is not None and self.cell is not None:
                  self.row.append(' '.join(self.cell.split())); self.cell=None
                elif tag=='tr' and self.row is not None:
                  if self.row: self.rows.append(self.row)
                  self.row=None
            rawhtml=subprocess.run(['curl','-L','--fail','--silent','--show-error','--max-time','30','--retry','4','-A','Mozilla/5.0','https://www.ibjarates.com/'],capture_output=True,text=True)
            if rawhtml.returncode: raise RuntimeError(rawhtml.stderr.strip() or 'IBJA fetch failed')
            p=P(); p.feed(rawhtml.stdout)
            rows=p.rows
            gold_row=next((r for r in rows if r and r[0].lower().startswith('gold 999') and len(r)>=3),None)
            silver_row=next((r for r in rows if r and r[0].lower().startswith('silver 999') and len(r)>=3),None)
            if not gold_row or not silver_row: raise RuntimeError('IBJA current rates not found')
            gold_pm=float(gold_row[2].replace(',','')); silver_pm=float(silver_row[2].replace(',',''))
            dates=[]
            for r in rows:
              if r and re.match(r'^\\d{2}/\\d{2}/\\d{4}
          css='body{font-family:Arial;background:linear-gradient(135deg,#071a33,#020b17);color:#fff;margin:0;padding:30px}header{text-align:center;padding:20px;border-bottom:1px solid #806b25}.logo{font-size:28px;font-weight:800;color:#f1d77a}.tag{color:#aebbd0;font-size:12px;letter-spacing:3px}.date{display:inline-block;margin:20px;padding:9px 18px;border:1px solid #806b25;border-radius:30px;color:#f1d77a}.container{max-width:1100px;margin:auto}.intro{text-align:center}.intro p,.note{color:#aebbd0;font-size:12px}.snapshot{margin:25px 0;padding:15px;text-align:center;border:1px solid #806b25;border-radius:15px}.section{margin-top:28px}h2{font-size:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.card{background:#ffffff0d;border:1px solid #ffffff18;border-radius:15px;padding:19px}.name{color:#aebbd0;font-size:12px;text-transform:uppercase}.value{font-size:23px;font-weight:800;margin-top:8px}.change{margin-top:7px;font-weight:700}.up{color:#28c76f}.down{color:#ff5c5c}.neutral{color:#f1d77a}.insight{margin-top:28px;padding:20px;border:1px solid #806b25;border-radius:15px;color:#d6dfec}footer{text-align:center;margin-top:30px;padding:25px;color:#aebbd0}footer strong{color:#f1d77a}'
          h=f'''<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bikusura Group | Daily Market Updates - {date_text.title()}</title><style>{css}</style></head><body><header><div class="logo">BIKUSURA GROUP</div><div class="tag">BUILDING WEALTH • CREATING LEGACY</div><div class="date">{date_text}</div></header><main class="container"><div class="intro"><h1>Daily Market Updates</h1><p>Global, Indian, Commodity &amp; Crypto Market Snapshot</p></div><div class="snapshot">Automatically updated market data • Last update: {updated_text}</div>{sec('Global Indices',glob)}{sec('Indian Market',india)}{sec('INR / Dollar',card('USD / INR','₹'+fmt(usd),q('USD/INR')[1],'1 USD in INR'))}{sec('Crude Oil',card('Brent Crude','$'+fmt(q('Brent Crude')[0]),q('Brent Crude')[1],'Per barrel')+card('WTI Crude','$'+fmt(q('WTI Crude')[0]),q('WTI Crude')[1],'Per barrel'))}{sec('Gold &amp; Silver',card('Gold','₹'+fmt(gold[0],0),gold[1],'IBJA Gold 999 • Per 10 gm • PM benchmark')+card('Silver','₹'+fmt(silver[0],0),silver[1],'IBJA Silver 999 • Per kg • PM benchmark'))}{sec('Crypto • INR Spot',card('Bitcoin (BTC)','₹'+fmt(btci,0),q('Bitcoin')[1],'Daily spot • INR')+card('Ethereum (ETH)','₹'+fmt(ethi,0),q('Ethereum')[1],'Daily spot • INR'))}<div class="insight"><h2>Market Insight</h2><p>Market data is fetched automatically. Yahoo Finance uses one multi-symbol request to reduce rate-limit failures; GIFT Nifty comes from the NSE India market-status feed.</p></div></main><footer><strong>BIKUSURA GROUP</strong><div>Market data is for information only and is not investment advice.</div></footer></body></html>'''
          Path('Bikusura_Daily_Market_Updates.html').write_text(h,encoding='utf-8')
          print('Generated',updated_text)
          PY
